name: CI

# Build and test on every push and pull request; on a `v*` tag, additionally pack and publish to
# NuGet through Trusted Publishing (GitHub OIDC). No credentials are referenced anywhere: the
# default run is green without any Mailgun or NuGet secrets (constitution Principle III), and the
# publish key is minted per run by nuget.org for this repository + workflow file only.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        # Pinned to a commit SHA (v4.2.2) for supply-chain integrity; Dependabot bumps it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so MinVer can resolve the version deterministically.
          fetch-depth: 0

      - name: Setup .NET
        # Pinned to a commit SHA (v4.3.1) for supply-chain integrity; Dependabot bumps it.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The .NET 8 runtime for the net8.0 test leg; global.json pins the SDK used to build.
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Audit dependencies for known vulnerabilities
        if: runner.os == 'Linux'
        shell: bash
        # Fails the build if any (transitive) package has a known advisory. NU1901-NU1904 are
        # warnings during build (so a new CVE doesn't break local dev); this is the explicit gate.
        run: |
          report=$(dotnet list package --vulnerable --include-transitive)
          echo "$report"
          # This exact phrase appears only when a project HAS vulnerable packages
          # ("...has no vulnerable packages" is the clean case), so it is an unambiguous gate.
          if echo "$report" | grep -q 'has the following vulnerable packages'; then
            echo "::error::Vulnerable NuGet packages detected (see the audit output above)."
            exit 1
          fi

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (net10.0, net8.0)
        run: dotnet test --project tests/Mailgunner.Tests --configuration Release --no-build

      - name: Test (net48, netstandard2.0 asset)
        if: runner.os == 'Windows'
        run: dotnet test --project tests/Mailgunner.NetFxTests --configuration Release --no-build

  release:
    # Only a `v*` tag, and only after the whole test matrix is green. MinVer derives the package
    # version from the tag. Publishing uses NuGet Trusted Publishing: the policy on nuget.org is bound
    # to this repository and to this workflow file (ci.yml), so this job must stay in this file.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token NuGet/login exchanges for a short-lived key
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        # Builds, then packs with package validation (EnablePackageValidation) into artifacts/.
        run: dotnet pack src/Mailgunner/Mailgunner.csproj --configuration Release --output artifacts

      - name: Log in to NuGet (trusted publishing)
        id: nuget-login
        # Pinned to a commit SHA (v1.2.0); this step obtains the publish key, so a mutable tag must
        # not be trusted. Dependabot bumps the pin.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: gberikov

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
